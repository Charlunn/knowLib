# knowLib nginx server block
# 复制到 /etc/nginx/conf.d/knowlib.conf，把 YOUR_DOMAIN 替换成你的真实域名。
# 然后运行: sudo certbot --nginx -d YOUR_DOMAIN
#
# 本文件由 scripts/start-behind-nginx.sh 使用。

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    # certbot 续签验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name YOUR_DOMAIN;

    # certbot 会自动填写证书路径（运行 certbot --nginx 后会修改这里）
    # ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # 客户端真实 IP 透传
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # WebSocket + SSE（MCP 用 SSE，LiveSync 用 WebSocket）
    proxy_http_version 1.1;
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $http_connection;

    # tidy 整理调 LLM 可能跑 10 分钟
    proxy_read_timeout 660s;
    proxy_send_timeout 660s;

    # 所有流量转到 caddy
    location / {
        proxy_pass http://127.0.0.1:8080;
    }

    # WebDAV for Obsidian Remotely Save
    # Obsidian 配置 URL: https://YOUR_DOMAIN/dav
    location /dav {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Destination $http_destination;
        proxy_set_header Overwrite   $http_overwrite;
        client_max_body_size 100m;
    }
}
