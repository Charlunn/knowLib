# docker-compose.behind-nginx.yml
# 适用于宿主已有 nginx 占用 80/443 的情况。
# Caddy 退化为内部 HTTP 反代，仅绑定 127.0.0.1:8080。
# TLS 由宿主 nginx + certbot 负责。
#
# 架构: nginx → caddy → {api, web, webdav}
# 同步: Obsidian ← Remotely Save (WebDAV) → data/vault/ ← knowLib services
#
# 启动方式: scripts/start-behind-nginx.sh
# 或手动:   docker compose -f docker-compose.behind-nginx.yml up -d

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./Caddyfile.behind-nginx:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
      - ./data/caddy/log:/var/log/caddy
    depends_on:
      - api
      - web
      - webdav
    networks:
      - default
      - knowlib-shared
      - new-api-network

  # WebDAV server for Obsidian Remotely Save plugin.
  # Serves data/vault/ over WebDAV with Basic Auth.
  webdav:
    image: bytemark/webdav:latest
    restart: unless-stopped
    environment:
      AUTH_TYPE: Basic
      USERNAME: ${WEBDAV_USER:-obsidian}
      PASSWORD: ${WEBDAV_PASSWORD:-${COUCHDB_OBSIDIAN_PASSWORD}}
    volumes:
      - ./data/vault:/var/lib/dav/data
    # No ports exposed — only reachable via caddy on the internal network.

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage

  embedder:
    build: ./apps/embedder
    restart: unless-stopped
    environment:
      EMBED_MODEL: ${EMBED_MODEL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      VAULT_PATH: ${VAULT_PATH}
      KNOWLIB_DIR: ${KNOWLIB_DIR}
      TZ: ${TZ}
    volumes:
      - ./data/vault:/data/vault
      - ./data/embedder-cache:/cache
    depends_on:
      - qdrant

  tidy:
    build: ./apps/tidy
    restart: unless-stopped
    environment:
      VAULT_PATH: ${VAULT_PATH}
      INBOX_DIR: ${INBOX_DIR}
      NOTES_DIR: ${NOTES_DIR}
      ATLAS_DIR: ${ATLAS_DIR}
      KNOWLIB_DIR: ${KNOWLIB_DIR}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      EMBED_BASE_URL: ${EMBED_BASE_URL}
      EMBED_MODEL: ${EMBED_MODEL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      TIDY_TOP_K: ${TIDY_TOP_K}
      TIDY_MAX_TOKENS: ${TIDY_MAX_TOKENS}
      TZ: ${TZ}
    volumes:
      - ./data/vault:/data/vault
    depends_on:
      - embedder
      - qdrant

  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
      JWT_SECRET: ${JWT_SECRET}
      TOTP_ISSUER: ${TOTP_ISSUER}
      TOTP_ACCOUNT: ${TOTP_ACCOUNT}
      TOTP_SECRET: ${TOTP_SECRET}
      VAULT_PATH: ${VAULT_PATH}
      INBOX_DIR: ${INBOX_DIR}
      NOTES_DIR: ${NOTES_DIR}
      ATLAS_DIR: ${ATLAS_DIR}
      KNOWLIB_DIR: ${KNOWLIB_DIR}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      OPENAI_MODEL: ${OPENAI_MODEL}
      EMBED_BASE_URL: ${EMBED_BASE_URL}
      EMBED_MODEL: ${EMBED_MODEL}
      QDRANT_URL: ${QDRANT_URL}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION}
      TIDY_TOP_K: ${TIDY_TOP_K}
      TIDY_SERVICE_URL: http://tidy:8081
      SKILL_BUNDLE_DIR: /skill-bundle
      TZ: ${TZ}
    volumes:
      - ./data/vault:/data/vault
      - ./data/api-state:/state
      - ./packages/skill-bundle:/skill-bundle:ro
    depends_on:
      - qdrant
      - embedder
      - tidy

  web:
    build: ./apps/web
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_DOMAIN: ${DOMAIN}
      API_INTERNAL_URL: http://api:8080
      TZ: ${TZ}
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:

networks:
  default:
  knowlib-shared:
    external: true
  new-api-network:
    external: true
