# knowLib 基础分类配置
#
# 启动时 tidy 会检查 notes/ 下是否存在这些主题入口文件,
# 不存在就自动创建。AI 整理时会优先把笔记放进这些已有分类,
# 只有当内容确实不属于任何已有分类时,才允许新建分类。
#
# 用户可以编辑这个文件增删分类,但建议保持精简(8-10 个顶级分类)。

# 顶级分类列表。每个会成为 notes/<name>.md 主题入口文件。
categories:
  - 学习
  - 编程
  - 工作
  - 阅读
  - 生活
  - 想法
  - 项目
  - 备忘

# 路径深度上限。
# notes/<分类>/<子笔记>.md     ← 2 级,允许
# notes/<分类>/<子目录>/xxx.md ← 3 级,允许
# 超过 3 级 → 拒绝
max_depth: 3
